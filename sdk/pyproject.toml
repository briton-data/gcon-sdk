[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gcon-sdk"
version = "1.0.0"
description = "Official Python SDK for GCON: run jobs, verify results, and get a receipt for every one"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "Apache-2.0"}
authors = [
    {name = "GCON", email = "contact@gcon.network"}
]
keywords = [
    "gcon",
    "sdk",
    "api-client",
    "job-orchestration",
    "distributed-computing",
    "gpu",
    "mlops",
    "audit",
    "receipts",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://gcon.network"
Repository = "https://github.com/briton-data/gcon-sdk"
"Bug Tracker" = "https://github.com/briton-data/gcon-sdk/issues"
Changelog = "https://github.com/briton-data/gcon-sdk/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["gcon_sdk"]

[tool.setuptools.package-data]
gcon_sdk = ["py.typed"]
